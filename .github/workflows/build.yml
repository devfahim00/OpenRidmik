name: Build Debug APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OpenRidmik-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish debug APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG=debug-latest; else TAG=debug-${GITHUB_REF_NAME}; fi
          cp app/build/outputs/apk/debug/app-debug.apk OpenRidmik-debug.apk
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" OpenRidmik-debug.apk \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "OpenRidmik debug build (${GITHUB_REF_NAME})" \
            --notes "Automated debug build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
