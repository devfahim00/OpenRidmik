name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OpenRidmik-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish debug APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OpenRidmik-debug.apk
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest OpenRidmik-debug.apk \
            --prerelease \
            --title "OpenRidmik debug build" \
            --notes "Automated debug build from commit ${GITHUB_SHA}"
